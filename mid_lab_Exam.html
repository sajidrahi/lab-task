<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Global Tech Connect - Event Registration</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
  .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  h2 { text-align: center; }
  label { font-weight: bold; display: block; margin-top: 15px; }
  input[type=text], input[type=email] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; }
  .error { color: red; font-size: 14px; }
  .btn { margin-top: 20px; width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
  .btn:hover { background: #0056b3; }
  #analyticsPanel { margin-top: 20px; padding: 15px; background: #eef; border-radius: 8px; display: none; }
</style>
</head>
<body>
<div class="container">
  <h2>Event Registration</h2>

  <form id="regForm">
    <label>Full Name</label>
    <input type="text" id="fullName" />
    <p class="error" id="nameError"></p>

    <label>Professional Email</label>
    <input type="email" id="email" />
    <p class="error" id="emailError"></p>

    <label>Company / Institution (Optional)</label>
    <input type="text" id="company" />

    <label>Attendance Type</label>
    <input type="radio" name="attendance" value="Virtual" /> Virtual
    <input type="radio" name="attendance" value="In-Person" /> In-Person
    <p class="error" id="attendanceError"></p>

    <button type="submit" class="btn">Register</button>
  </form>

  <button id="analyticsBtn" class="btn" style="margin-top:15px; background:#28a745;">Show Event Analytics</button>

  <div id="analyticsPanel">
    <h3>Event Analytics</h3>
    <p>Total Registrants: <span id="totalReg">0</span></p>
    <p>Virtual: <span id="virtualCount">0</span></p>
    <p>In-Person: <span id="inPersonCount">0</span></p>
  </div>
</div>

<script>
  const registrants = [];

  const form = document.getElementById('regForm');
  const aBtn = document.getElementById('analyticsBtn');
  const panel = document.getElementById('analyticsPanel');

  form.addEventListener('submit', function(e){
    e.preventDefault();

    let name = document.getElementById('fullName').value.trim();
    let email = document.getElementById('email').value.trim();
    let company = document.getElementById('company').value.trim();
    let attendance = document.querySelector('input[name="attendance"]:checked');

    let valid = true;

    // Name validation
    if(name.length < 6 || name.length > 100){
      document.getElementById('nameError').textContent = "Name must be between 6 and 100 characters.";
      valid = false;
    } else {
      document.getElementById('nameError').textContent = "";
    }

    // Email validation
    if(!email.includes('@') || !email.includes('.')){
      document.getElementById('emailError').textContent = "Please enter a valid professional email address.";
      valid = false;
    } else {
      document.getElementById('emailError').textContent = "";
    }

    // Attendance validation
    if(!attendance){
      document.getElementById('attendanceError').textContent = "Please select your attendance type.";
      valid = false;
    } else {
      document.getElementById('attendanceError').textContent = "";
    }

    if(valid){
      registrants.push({ name, email, company, attendance: attendance.value });
      alert('Registration Successful!');
      form.reset();
      updateStats();
    }
  });

  function updateStats(){
    let virtual = registrants.filter(r => r.attendance === 'Virtual').length;
    let inPerson = registrants.filter(r => r.attendance === 'In-Person').length;

    document.getElementById('totalReg').textContent = registrants.length;
    document.getElementById('virtualCount').textContent = virtual;
    document.getElementById('inPersonCount').textContent = inPerson;
  }

  aBtn.addEventListener('click', function(){
    if(panel.style.display === 'none'){
      panel.style.display = 'block';
      aBtn.textContent = 'Hide Event Analytics';
    } else {
      panel.style.display = 'none';
      aBtn.textContent = 'Show Event Analytics';
    }
  });
</script>

</body>
</html>
